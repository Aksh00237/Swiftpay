spring.application.name=recharge-service
# Default port; extra instances are started with --server.port=8087 / 8088 (see README)
server.port=8083

# Spring Boot 4 uses spring.mongodb.* (the old spring.data.mongodb.uri is ignored and silently falls back to the "test" DB)
spring.mongodb.uri=mongodb://localhost:27017/swiftpay_recharge?directConnection=true
spring.data.mongodb.representation.big-decimal=decimal128
