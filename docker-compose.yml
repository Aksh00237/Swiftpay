# MongoDB as a single-node replica set.
# A replica set is required for multi-document transactions (@Transactional) used by p2p and p2m.
services:
  mongo:
    image: mongo:7
    container_name: swiftpay-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then just reports status
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
