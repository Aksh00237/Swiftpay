spring.application.name=escrow-service
server.port=8084

# Same database as p2p/p2m: escrow moves money between the same user wallets.
spring.mongodb.uri=mongodb://localhost:27017/swiftpay?directConnection=true
spring.data.mongodb.representation.big-decimal=decimal128
# Creates the unique index on idempotencyKey at startup
spring.data.mongodb.auto-index-creation=true

# How long the seller has to mark the order shipped before the buyer is auto-refunded
escrow.delivery-window=72h
# How long the buyer has to confirm or dispute after shipping before the seller is auto-paid
escrow.confirm-window=120h
# How often the scheduler looks for expired orders (milliseconds)
escrow.scheduler-delay-ms=60000
# The X-User-Id that is allowed to resolve disputes
escrow.admin-id=admin

# For a quick demo, shrink the windows, e.g.:
# ./gradlew bootRun --args='--escrow.delivery-window=2m --escrow.confirm-window=2m --escrow.scheduler-delay-ms=10000'
